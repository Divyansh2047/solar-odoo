services:
  - type: web
    name: arka
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: arka-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      # one proxy hop (Render's load balancer): req.ip is the real client, and a client can't spoof it
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: APP_URL
        value: https://arka.scriptjacker.in
      - key: MAIL_FROM
        value: Arka <no-reply@auth.scriptjacker.in>
      - key: RESEND_API_KEY
        sync: false
      - key: DEMO_DAYS
        value: "60"

databases:
  - name: arka-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: arka
