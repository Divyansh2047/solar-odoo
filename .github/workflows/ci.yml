name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/arka_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Integration tests (real PostgreSQL)
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end smoke test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/arka_e2e
          NODE_ENV: development
          OTP_DEV_ECHO: 'true'
          APP_URL: http://localhost:4000
          DEMO_DAYS: '20'
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE arka_e2e"
          npx playwright install --with-deps chromium
          node server/dist/index.js &
          npx wait-on -t 180000 http://localhost:4000/api/health
          BASE_URL=http://localhost:4000 npm run e2e
